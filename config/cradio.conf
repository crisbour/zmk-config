# zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=300

# Deep sleep: power down the MCU after inactivity (biggest idle-drain fix)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Battery reporting on both halves. Central-only options: cradio_left.conf.
CONFIG_ZMK_BATTERY_REPORTING=y
# Reduce battery-level BLE reports (default is 60s); 600s = every 10 min
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# Improved BLE connection stability/efficiency (planned to be default upstream)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable combos
CONFIG_ZMK_COMBO=y
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=4
CONFIG_ZMK_COMBO_MAX_COMBOS=32

# Enable hold-tap behaviors
#CONFIG_ZMK_BEHAVIOR_HOLD_TAP=y

# Enable macro behaviors
CONFIG_ZMK_BEHAVIOR_MACRO=y
